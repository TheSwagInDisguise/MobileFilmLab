name: Continuous Integration
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify source, release guard and documentation
        run: |
          python3 scripts/verify_release.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_docs.py
      - name: Unit and native-graphics regression tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          retention-days: 7
          path: |
            app/build/outputs/documentation-screenshots/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
