name: Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g. v0.1.0-alpha.1)'
        required: false
        default: 'v0.1.0-alpha.1'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Unit Tests & Recipe Validation
        run: ./gradlew test --stacktrace

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -lh keystore/release.jks

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate, Align and Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_NAME="${RAW_TAG#refs/tags/}"
          echo "Processing release for tag: $TAG_NAME"
          
          BUILT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK: $BUILT_APK"
          
          SIGNED_APK_NAME="MobileFilmLab-${TAG_NAME}-signed.apk"
          
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Build Tools: $BUILD_TOOLS_DIR"
          
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$BUILT_APK" "aligned.apk"
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks keystore/release.jks \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK_NAME" \
            "aligned.apk"
            
          echo "Successfully signed: $SIGNED_APK_NAME"
          ls -lh "$SIGNED_APK_NAME"

      - name: Verify Signed APK Integrity and Certificate
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_NAME="${RAW_TAG#refs/tags/}"
          SIGNED_APK_NAME="MobileFilmLab-${TAG_NAME}-signed.apk"
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          
          echo "=== Verifying APK Signature ==="
          $BUILD_TOOLS_DIR/apksigner verify --verbose --print-certs "$SIGNED_APK_NAME"
          
          echo "=== Inspecting Package and Version via aapt2 ==="
          $BUILD_TOOLS_DIR/aapt2 dump badging "$SIGNED_APK_NAME" | grep -E "package:|application-label:"

      - name: Generate Checksums
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_NAME="${RAW_TAG#refs/tags/}"
          SIGNED_APK_NAME="MobileFilmLab-${TAG_NAME}-signed.apk"
          sha256sum "$SIGNED_APK_NAME" > checksums.txt
          cat checksums.txt

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            MobileFilmLab-*-signed.apk
            checksums.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG_NAME="${RAW_TAG#refs/tags/}"
          SIGNED_APK_NAME="MobileFilmLab-${TAG_NAME}-signed.apk"
          
          # Delete existing release if re-running
          gh release delete "$TAG_NAME" --yes 2>/dev/null || true
          
          gh release create "$TAG_NAME" \
            "$SIGNED_APK_NAME" \
            checksums.txt \
            --title "$TAG_NAME" \
            --notes-file CHANGELOG.md
