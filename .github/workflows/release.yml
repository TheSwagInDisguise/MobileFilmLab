name: Release Signed APK
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Already-pushed tag to release (must match source version)
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
      APPROVED_RELEASE_TAG: ${{ vars.APPROVED_RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag_name || github.ref }}
      - name: Block unapproved promotion and verify exact tag/source identity
        run: |
          python3 scripts/verify_release.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_docs.py
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Unit and native-graphics regression tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
      - name: Android release lint
        run: ./gradlew lintRelease --no-daemon --stacktrace
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          mkdir -p keystore
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify signed package, version, alignment and established certificate
        run: |
          cp app/build/outputs/apk/release/app-release.apk "MobileFilmLab-${RELEASE_TAG}-signed.apk"
          python3 scripts/verify_apk.py "MobileFilmLab-${RELEASE_TAG}-signed.apk"
          sha256sum "MobileFilmLab-${RELEASE_TAG}-signed.apk" > checksums.txt
          cp docs/TESTING.md TESTING.md
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-qa-reports
          retention-days: 7
          path: |
            app/build/outputs/documentation-screenshots/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
      - name: Upload verified deliverables
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: |
            MobileFilmLab-*-signed.apk
            checksums.txt
            TESTING.md
      - name: Publish approved release (prereleases never auto-promote)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'This release already exists; refusing to overwrite a published APK. Use a new version/tag.'
            exit 1
          fi
          FLAGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then FLAGS+=(--prerelease --latest=false); fi
          case "$RELEASE_TAG" in
            *-alpha.*) TITLE="$RELEASE_TAG — alpha test candidate" ;;
            *-beta.*) TITLE="$RELEASE_TAG — public beta" ;;
            *-rc.*) TITLE="$RELEASE_TAG — release candidate" ;;
            *) TITLE="$RELEASE_TAG" ;;
          esac
          gh release create "$RELEASE_TAG" \
            "MobileFilmLab-${RELEASE_TAG}-signed.apk" checksums.txt TESTING.md \
            --verify-tag --title "$TITLE" \
            --notes-file ".github/release-notes/${RELEASE_TAG#v}.md" "${FLAGS[@]}"
      - name: Remove signing material
        if: always()
        run: rm -rf keystore
