name: MobileFilmLab
options:
  bundleIdPrefix: com.mobilefilmlab
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
packages:
  FilmLabCore:
    path: Packages/FilmLabCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ''
    MFL_SOURCE_SHA: local-development
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_OPTIMIZATION_LEVEL: '-O'
    ENABLE_TESTABILITY: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CLANG_ENABLE_MODULES: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
targets:
  MobileFilmLab:
    type: application
    platform: iOS
    sources:
      - path: MobileFilmLab
    dependencies:
      - package: FilmLabCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: MobileFilmLab
        CFBundleName: MobileFilmLab
        CFBundleIdentifier: com.mobilefilmlab.camera
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        MFLSourceSHA: $(MFL_SOURCE_SHA)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ''
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: MobileFilmLab takes photographs with the camera and shows live recipe previews. It does not record video or audio.
        NSPhotoLibraryAddUsageDescription: Optionally save your JPEG and unmodified DNG photographs to Apple Photos. A private app copy is retained first.
        NSMotionUsageDescription: Motion data drives the horizon level and conservative handheld HDR exposure guards. It is not uploaded.
        CFBundleDocumentTypes:
          - CFBundleTypeName: MobileFilmLab recipe
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.mobilefilmlab.recipe]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.mobilefilmlab.recipe
            UTTypeDescription: MobileFilmLab recipe document
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [filmrecipe]
              public.mime-type: application/json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilefilmlab.camera
        PRODUCT_NAME: MobileFilmLab
  MobileFilmLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MobileFilmLabTests]
    dependencies:
      - target: MobileFilmLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilefilmlab.camera.tests
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
  MobileFilmLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MobileFilmLabUITests]
    dependencies:
      - target: MobileFilmLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilefilmlab.camera.uitests
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
schemes:
  MobileFilmLab:
    build:
      targets:
        MobileFilmLab: all
        MobileFilmLabTests: [test]
        MobileFilmLabUITests: [test]
    test:
      targets: [MobileFilmLabTests, MobileFilmLabUITests]
      gatherCoverageData: true
