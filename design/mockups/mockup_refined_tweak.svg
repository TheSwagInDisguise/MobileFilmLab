<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 880" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradTweak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C22"/><stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="vfSceneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#11161B" stop-opacity="0.8"/>
    </linearGradient>
    <!-- 2D Tone/Color Pad Gradient (Warm amber to Cool teal on X, High contrast to Low contrast on Y) -->
    <linearGradient id="padGradX" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3498DB" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E67E22" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="880" rx="36" fill="url(#bodyGradTweak)" stroke="#30333E" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="864" rx="28" fill="#000000"/>

  <circle cx="200" cy="22" r="7" fill="#050608" stroke="#1A1C22" stroke-width="1.5"/>

  <!-- Live Viewfinder in background (dimmed slightly) -->
  <g transform="translate(16, 44)">
    <rect x="0" y="0" width="368" height="320" rx="20" fill="url(#vfSceneBg)"/>
    <circle cx="280" cy="100" r="32" fill="#FFA500" opacity="0.4"/>
    <path d="M 0 240 Q 180 180 368 230 L 368 320 L 0 320 Z" fill="#0A0B10" opacity="0.9"/>
  </g>

  <!-- MODAL BOTTOM SHEET: Film Look Selector & 2D Control Square Pad -->
  <g transform="translate(16, 380)">
    <!-- Sheet background -->
    <rect x="0" y="0" width="368" height="474" rx="24" fill="#13151D" stroke="#2D3242" stroke-width="1.5"/>
    
    <!-- Sheet handle bar -->
    <rect x="164" y="10" width="40" height="4" rx="2" fill="#4B5162"/>

    <!-- Recipe Title & Group -->
    <g transform="translate(20, 24)">
      <text x="0" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="17" font-weight="800">Kodak Portra 400</text>
      <text x="0" y="36" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Kodak • Warm Golden Pastel Tone</text>
      <!-- Favorite Star -->
      <path d="M 314 15 L 316.5 20.5 L 322.5 21.2 L 318 25.3 L 319.3 31 L 314 28 L 308.7 31 L 310 25.3 L 305.5 21.2 L 311.5 20.5 Z" fill="#F1C40F"/>
    </g>

    <!-- HORIZONTAL RECIPE CAROUSEL (Live thumbnails) -->
    <g transform="translate(20, 72)">
      <!-- Portra 400 (Active) -->
      <rect x="0" y="0" width="76" height="52" rx="10" fill="#202432" stroke="#F39C12" stroke-width="2"/>
      <circle cx="38" cy="20" r="10" fill="#E67E22"/>
      <text x="38" y="44" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">Portra 400</text>

      <!-- Portra 160 -->
      <rect x="84" y="0" width="76" height="52" rx="10" fill="#181A24" stroke="#2E3342" stroke-width="1"/>
      <circle cx="122" cy="20" r="10" fill="#F39C12" opacity="0.8"/>
      <text x="122" y="44" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Portra 160</text>

      <!-- Classic Chrome -->
      <rect x="168" y="0" width="76" height="52" rx="10" fill="#181A24" stroke="#2E3342" stroke-width="1"/>
      <circle cx="206" cy="20" r="10" fill="#D35400" opacity="0.8"/>
      <text x="206" y="44" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Classic Chr</text>

      <!-- Acros +R -->
      <rect x="252" y="0" width="76" height="52" rx="10" fill="#181A24" stroke="#2E3342" stroke-width="1"/>
      <circle cx="290" cy="20" r="10" fill="#E74C3C" opacity="0.8"/>
      <text x="290" y="44" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Acros +R</text>
    </g>

    <!-- 2D CONTROL SQUARE PAD (Like iPhone 16/18 Pro Photographic Styles!) -->
    <g transform="translate(64, 142)">
      <!-- 2D Pad Frame (240x240) -->
      <rect x="0" y="0" width="240" height="240" rx="20" fill="#0C0E14" stroke="#2D3242" stroke-width="2"/>
      <rect x="0" y="0" width="240" height="240" rx="20" fill="url(#padGradX)"/>

      <!-- Crosshair Axes -->
      <line x1="120" y1="0" x2="120" y2="240" stroke="#3E4458" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="0" y1="120" x2="240" y2="120" stroke="#3E4458" stroke-width="1" stroke-dasharray="3 3"/>
      
      <!-- Axis Labels (Tone / Color) -->
      <text x="120" y="16" fill="#7E8498" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">CONTRAST (+)</text>
      <text x="120" y="232" fill="#7E8498" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">MUTED (-)</text>
      <text x="18" y="123" fill="#3498DB" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">COOL</text>
      <text x="222" y="123" fill="#E67E22" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">WARM</text>

      <!-- Center Zero Point -->
      <circle cx="120" cy="120" r="3" fill="#586076"/>

      <!-- DRAGGABLE PUCK / CONTROLLER DOT (Tuned to Tone: +15, Warmth: +25) -->
      <g transform="translate(150, 95)">
        <!-- Puck outer halo -->
        <circle cx="0" cy="0" r="22" fill="#F39C12" opacity="0.25"/>
        <circle cx="0" cy="0" r="14" fill="#FFFFFF" stroke="#F39C12" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="5" fill="#F39C12"/>
      </g>
    </g>

    <!-- Real-time Puck Readout & Reset -->
    <g transform="translate(24, 400)">
      <text x="12" y="16" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="700">Tone: +15  ·  Warmth: +25 (A2 G0)</text>
      
      <!-- Reset button -->
      <rect x="236" y="0" width="76" height="24" rx="6" fill="#1C1F2B" stroke="#3A3E50" stroke-width="1"/>
      <text x="274" y="16" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RESET</text>
    </g>

    <!-- Save As Custom Recipe Button -->
    <g transform="translate(24, 432)">
      <rect x="0" y="0" width="320" height="32" rx="10" fill="#F39C12"/>
      <text x="160" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">SAVE AS CUSTOM RECIPE</text>
    </g>
  </g>
</svg>