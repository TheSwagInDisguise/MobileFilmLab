<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 880" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradPro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C22"/><stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="vfSceneCold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2980B9" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#1A2536" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="400" height="880" rx="36" fill="url(#bodyGradPro)" stroke="#30333E" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="864" rx="28" fill="#000000"/>

  <circle cx="200" cy="22" r="7" fill="#050608" stroke="#1A1C22" stroke-width="1.5"/>
  <text x="32" y="26" fill="#757987" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <g transform="translate(330, 16)" fill="#757987">
    <rect x="18" y="3" width="18" height="9" rx="2" fill="none" stroke="#757987" stroke-width="1.2"/>
    <rect x="20" y="5" width="12" height="5" rx="1" fill="#4CD964"/>
    <path d="M 2 11 L 6 3 L 10 3 L 6 11 Z" fill="#757987"/>
  </g>

  <!-- TOP BAR: Mode Switcher with PRO active -->
  <g transform="translate(24, 46)">
    <circle cx="16" cy="16" r="14" fill="#14161F" opacity="0.8"/>
    <path d="M 16 9 L 12 16 L 16 16 L 15 23 L 20 15 L 16 15 Z" fill="#F1C40F"/>

    <rect x="124" y="0" width="152" height="32" rx="16" fill="#14161F" opacity="0.9" stroke="#2B2F3D" stroke-width="1"/>
    <text x="162" y="20" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">AUTO</text>
    <!-- Active PRO pill -->
    <rect x="202" y="2" width="72" height="28" rx="14" fill="#F39C12"/>
    <text x="238" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRO</text>

    <!-- Diagnostics shortcut -->
    <circle cx="332" cy="16" r="14" fill="#14161F" stroke="#3A3E4E" stroke-width="1"/>
    <text x="332" y="20" fill="#2ECC71" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">ID:0</text>
  </g>

  <!-- LIVE VIEWFINDER WITH PRO HUD -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="368" height="490" rx="20" fill="url(#vfSceneCold)"/>
    
    <!-- Pro Waveform / Histogram in top corner -->
    <rect x="12" y="12" width="74" height="26" rx="6" fill="#000000" opacity="0.6"/>
    <path d="M 16 32 Q 30 18 45 26 T 80 32" stroke="#2ECC71" stroke-width="1.5" fill="none"/>
    <text x="50" y="20" fill="#FFFFFF" font-family="monospace" font-size="8">HISTO</text>

    <!-- Top Telemetry Line -->
    <g transform="translate(110, 12)">
      <rect x="0" y="0" width="246" height="26" rx="6" fill="#000000" opacity="0.65"/>
      <text x="12" y="17" fill="#FFFFFF" font-family="monospace" font-size="9" font-weight="700">1/125s · f/1.6 · ISO 100 · +0.3</text>
    </g>

    <!-- Mountain landscape in cold Cine tone -->
    <path d="M 0 350 Q 90 260 180 320 T 368 290 L 368 490 L 0 490 Z" fill="#101824" opacity="0.85"/>
    <circle cx="280" cy="140" r="42" fill="#E0F2FE" opacity="0.4"/>

    <!-- TRANSLUCENT LENS SELECTION (UW, W, 3x, 10x) -->
    <g transform="translate(34, 426)">
      <rect x="0" y="0" width="300" height="48" rx="24" fill="#0A0B10" opacity="0.6" stroke="#3A3E4E" stroke-width="1"/>
      <circle cx="34" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="34" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">UW</text>

      <circle cx="94" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="94" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">W</text>

      <!-- [ 3x ] ACTIVE -->
      <circle cx="154" cy="24" r="20" fill="#FFFFFF" opacity="0.9"/>
      <text x="154" y="28" fill="#0A0B10" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3×</text>

      <!-- [ 2x ] CROP OPTION -->
      <rect x="188" y="10" width="38" height="28" rx="14" fill="#F39C12" opacity="0.95"/>
      <text x="207" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2×</text>

      <circle cx="266" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="266" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10×</text>
    </g>
  </g>

  <!-- PRO MANUAL PARAMETER STRIP (EV / ISO / SEC / WB / FOCUS) -->
  <g transform="translate(20, 594)">
    <rect x="0" y="0" width="360" height="40" rx="10" fill="#13151D" stroke="#252936" stroke-width="1"/>
    <!-- Parameter buttons -->
    <rect x="6" y="5" width="64" height="30" rx="6" fill="#F39C12"/>
    <text x="38" y="24" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">EV +0.3</text>

    <rect x="76" y="5" width="64" height="30" rx="6" fill="#1C1F2B"/>
    <text x="108" y="24" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ISO 100</text>

    <rect x="146" y="5" width="64" height="30" rx="6" fill="#1C1F2B"/>
    <text x="178" y="24" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1/125s</text>

    <rect x="216" y="5" width="68" height="30" rx="6" fill="#1C1F2B"/>
    <text x="250" y="24" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">5600K</text>

    <rect x="290" y="5" width="64" height="30" rx="6" fill="#1C1F2B"/>
    <text x="322" y="24" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">MF PEAK</text>
  </g>

  <!-- FILM LOOK NAME -->
  <g transform="translate(80, 646)">
    <rect x="0" y="0" width="240" height="36" rx="18" fill="#14161F" stroke="#2B2F3D" stroke-width="1.2"/>
    <circle cx="18" cy="18" r="5" fill="#3498DB"/>
    <text x="30" y="22" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Cinestill 800T</text>
    <path d="M 215 14 L 221 18 L 215 22" fill="none" stroke="#3498DB" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- PRO BOTTOM CONTROLS -->
  <g transform="translate(36, 730)">
    <rect x="6" y="20" width="48" height="48" rx="14" fill="#161820" stroke="#2E3240" stroke-width="1.5"/>
    <rect x="10" y="24" width="40" height="40" rx="10" fill="#262A36"/>
    <circle cx="30" cy="44" r="10" fill="#3498DB" opacity="0.8"/>

    <circle cx="164" cy="44" r="38" fill="#12141A" stroke="#363A48" stroke-width="2.5"/>
    <circle cx="164" cy="44" r="30" fill="#FFFFFF"/>
    <circle cx="164" cy="44" r="27" fill="#F5F6F8" stroke="#D1D4DC" stroke-width="1"/>

    <circle cx="282" cy="44" r="22" fill="#161820" stroke="#2E3240" stroke-width="1.5"/>
    <path d="M 278 44 L 286 44 M 282 40 L 282 48" stroke="#8E929E" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>