<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 880" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C22"/><stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="vfSceneWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E67E22" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#3A2215" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1218"/>
    </linearGradient>
  </defs>

  <!-- Oppo Find X9 Ultra Chassis -->
  <rect x="0" y="0" width="400" height="880" rx="36" fill="url(#bodyGradAuto)" stroke="#30333E" stroke-width="4"/>
  <rect x="8" y="8" width="384" height="864" rx="28" fill="#000000"/>

  <!-- Status Bar & Punch-Hole Camera -->
  <circle cx="200" cy="22" r="7" fill="#050608" stroke="#1A1C22" stroke-width="1.5"/>
  <text x="32" y="26" fill="#757987" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">09:41</text>
  <g transform="translate(330, 16)" fill="#757987">
    <rect x="18" y="3" width="18" height="9" rx="2" fill="none" stroke="#757987" stroke-width="1.2"/>
    <rect x="20" y="5" width="12" height="5" rx="1" fill="#4CD964"/>
    <path d="M 2 11 L 6 3 L 10 3 L 6 11 Z" fill="#757987"/>
  </g>

  <!-- TOP MINIMAL BAR: Spacious, only essentials -->
  <g transform="translate(24, 46)">
    <!-- Flash toggle -->
    <circle cx="16" cy="16" r="14" fill="#14161F" opacity="0.8"/>
    <path d="M 16 9 L 12 16 L 16 16 L 15 23 L 20 15 L 16 15 Z" fill="#F1C40F"/>

    <!-- AUTO vs PRO Mode Switcher Pill (Spacious, prominent) -->
    <rect x="124" y="0" width="152" height="32" rx="16" fill="#14161F" opacity="0.9" stroke="#2B2F3D" stroke-width="1"/>
    <!-- Active AUTO pill -->
    <rect x="126" y="2" width="72" height="28" rx="14" fill="#F39C12"/>
    <text x="162" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AUTO</text>
    <text x="238" y="20" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRO</text>

    <!-- RAW/JPG format badge -->
    <rect x="312" y="5" width="40" height="22" rx="6" fill="#14161F" opacity="0.8"/>
    <text x="332" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RAW</text>
  </g>

  <!-- IMMERSIVE LIVE VIEWFINDER: Uncluttered, generous breathing space -->
  <g transform="translate(16, 92)">
    <rect x="0" y="0" width="368" height="520" rx="20" fill="url(#vfSceneWarm)"/>
    
    <!-- Ultra-subtle compositional rule of thirds -->
    <line x1="122" y1="0" x2="122" y2="520" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="245" y1="0" x2="245" y2="520" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="0" y1="173" x2="368" y2="173" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>
    <line x1="0" y1="346" x2="368" y2="346" stroke="#FFFFFF" stroke-width="0.5" opacity="0.12"/>

    <!-- Scene simulation artwork: Golden hour mountains -->
    <path d="M 0 380 Q 90 280 180 350 T 368 320 L 368 520 L 0 520 Z" fill="#1B120C" opacity="0.8"/>
    <path d="M 60 420 Q 200 340 368 390 L 368 520 L 0 520 Z" fill="#0C0E14" opacity="0.95"/>
    <circle cx="280" cy="160" r="42" fill="#FFA500" opacity="0.55"/>

    <!-- Subtle electronic level in center -->
    <line x1="154" y1="260" x2="214" y2="260" stroke="#2ECC71" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="184" cy="260" r="3" fill="#2ECC71"/>

    <!-- FLOATING TRANSLUCENT LENS SELECTION (UW, W, 3x, 10x) -->
    <!-- Positioned inside/over lower viewfinder area with generous free space -->
    <g transform="translate(34, 456)">
      <!-- Background subtle translucent bar -->
      <rect x="0" y="0" width="300" height="48" rx="24" fill="#0A0B10" opacity="0.55" stroke="#3A3E4E" stroke-width="1"/>
      
      <!-- [ UW ] -->
      <circle cx="34" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="34" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">UW</text>

      <!-- [ W ] ACTIVE (Primary 1-inch) -->
      <circle cx="94" cy="24" r="20" fill="#FFFFFF" opacity="0.9"/>
      <text x="94" y="28" fill="#0A0B10" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">W</text>

      <!-- [ 2x ] CROP OPTION (Right next to active lens!) -->
      <rect x="128" y="10" width="38" height="28" rx="14" fill="#F39C12" opacity="0.95"/>
      <text x="147" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2×</text>

      <!-- [ 3x ] -->
      <circle cx="206" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="206" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3×</text>

      <!-- [ 10x ] -->
      <circle cx="266" cy="24" r="18" fill="#FFFFFF" opacity="0.12"/>
      <text x="266" y="28" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10×</text>
    </g>
  </g>

  <!-- HONEST CROP TELEMETRY: Minimal, subtle readout -->
  <text x="200" y="632" fill="#8E929E" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">
    23mm Wide • 2× Native-Pixel Crop (No Resample)
  </text>

  <!-- FILM LOOK NAME: Clean typography, tap to select & tweak -->
  <g transform="translate(80, 652)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="#14161F" stroke="#2B2F3D" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="5" fill="#F39C12"/>
    <text x="32" y="23" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Kodak Portra 400</text>
    <!-- Tap arrow icon -->
    <path d="M 215 15 L 221 19 L 215 23" fill="none" stroke="#F39C12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- SPACIOUS BOTTOM CONTROLS: Gallery, Shutter, Settings -->
  <g transform="translate(36, 730)">
    <!-- Gallery review thumbnail -->
    <rect x="6" y="20" width="48" height="48" rx="14" fill="#161820" stroke="#2E3240" stroke-width="1.5"/>
    <rect x="10" y="24" width="40" height="40" rx="10" fill="#262A36"/>
    <circle cx="30" cy="44" r="10" fill="#E67E22" opacity="0.8"/>

    <!-- Large tactile Shutter button (Photo only) -->
    <circle cx="164" cy="44" r="38" fill="#12141A" stroke="#363A48" stroke-width="2.5"/>
    <circle cx="164" cy="44" r="30" fill="#FFFFFF"/>
    <circle cx="164" cy="44" r="27" fill="#F5F6F8" stroke="#D1D4DC" stroke-width="1"/>

    <!-- Settings gear -->
    <circle cx="282" cy="44" r="22" fill="#161820" stroke="#2E3240" stroke-width="1.5"/>
    <path d="M 278 44 L 286 44 M 282 40 L 282 48" stroke="#8E929E" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>