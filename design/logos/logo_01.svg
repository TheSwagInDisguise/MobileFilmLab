<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#0A0B0D"/>
    </radialGradient>
    <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2574C"/><stop offset="100%" stop-color="#C2362B"/>
    </linearGradient>
    <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E88D38"/><stop offset="100%" stop-color="#D66B1F"/>
    </linearGradient>
    <linearGradient id="blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBB638"/><stop offset="100%" stop-color="#C99320"/>
    </linearGradient>
    <linearGradient id="blade4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853"/><stop offset="100%" stop-color="#1E8038"/>
    </linearGradient>
    <linearGradient id="blade5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DA4A8"/><stop offset="100%" stop-color="#14797E"/>
    </linearGradient>
    <linearGradient id="blade6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3C78D8"/><stop offset="100%" stop-color="#1C4B9E"/>
    </linearGradient>
    <linearGradient id="blade7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B52C7"/><stop offset="100%" stop-color="#552C9F"/>
    </linearGradient>
    <linearGradient id="blade8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C24585"/><stop offset="100%" stop-color="#9C2261"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>
  <!-- Outer metallic camera barrel ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#2D3139" stroke-width="6"/>
  <circle cx="256" cy="256" r="192" fill="#14161B" stroke="#3F444E" stroke-width="1.5"/>
  <!-- Knurling markings -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#252830" stroke-width="2" stroke-dasharray="3 7"/>
  <!-- Aperture group with drop shadow -->
  <g filter="url(#shadow1)" transform="translate(256,256)">
    <!-- 8 rotating blades creating the prismatic iris -->
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade1)" transform="rotate(0)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade2)" transform="rotate(45)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade3)" transform="rotate(90)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade4)" transform="rotate(135)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade5)" transform="rotate(180)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade6)" transform="rotate(225)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade7)" transform="rotate(270)"/>
    <path d="M 0 -150 A 150 150 0 0 1 106 -106 L 35 -35 A 50 50 0 0 0 0 -50 Z" fill="url(#blade8)" transform="rotate(315)"/>
    <!-- Central dark lens core -->
    <circle cx="0" cy="0" r="48" fill="#0D0E12" stroke="#252830" stroke-width="2"/>
    <!-- Central optic coating reflection -->
    <ellipse cx="-12" cy="-14" rx="20" ry="12" fill="#FFFFFF" opacity="0.12" transform="rotate(-30 -12 -14)"/>
  </g>
</svg>