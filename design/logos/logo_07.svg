<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg7" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#191A1F"/>
      <stop offset="100%" stop-color="#08080A"/>
    </radialGradient>
    <linearGradient id="bwSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#8A8F9E"/>
      <stop offset="100%" stop-color="#2D3038"/>
    </linearGradient>
    <linearGradient id="colorSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#33CC99"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg7)"/>
  <!-- Outer lens rim -->
  <circle cx="256" cy="256" r="190" fill="#121317" stroke="#333742" stroke-width="4"/>
  <!-- Left Half: Monochromatic Silver Halide -->
  <path d="M 256 66 A 190 190 0 0 0 256 446 Z" fill="#17181F"/>
  <!-- Monochrome diaphragm arcs -->
  <path d="M 256 106 A 150 150 0 0 0 256 406 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>
  <path d="M 256 146 A 110 110 0 0 0 256 366 Z" fill="none" stroke="#8A8F9E" stroke-width="4" opacity="0.6"/>
  <path d="M 256 186 A 70 70 0 0 0 256 326 Z" fill="none" stroke="#505563" stroke-width="3" opacity="0.9"/>
  <!-- Right Half: Vibrant Analog Color Emulsion -->
  <path d="M 256 66 A 190 190 0 0 1 256 446 Z" fill="#1B161A"/>
  <!-- Color spectrum concentric waves -->
  <path d="M 256 106 A 150 150 0 0 1 256 406 Z" fill="none" stroke="#FF3366" stroke-width="6"/>
  <path d="M 256 146 A 110 110 0 0 1 256 366 Z" fill="none" stroke="#FF9933" stroke-width="6"/>
  <path d="M 256 186 A 70 70 0 0 1 256 326 Z" fill="none" stroke="#33CC99" stroke-width="6"/>
  <!-- Central split aperture pupil -->
  <circle cx="256" cy="256" r="38" fill="#0C0D10" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Vertical dividing laser line -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <!-- Silver dot on left, amber dot on right -->
  <circle cx="242" cy="256" r="6" fill="#FFFFFF"/>
  <circle cx="270" cy="256" r="6" fill="#FF9933"/>
</svg>